<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Sign In</title>
		<link href="css/style.css" rel="stylesheet">
		<script src="scripts/login.js" type="module" defer></script>
	</head>
	<body>
		<h1>Sign In</h1>
		<section>
			<h2>Enter details</h2>
			<p>Don't have an account? <a href="./signup.html">Sign Up here</a></p>
			<form id="account-form" novalidate>
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>
				<p id="email-message"></p>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" min="2" required>
				<p id="password-message"></p>
				<p id="login-message" class="error"></p>
				<input type="submit" value="Continue">
			</form>
		</section>
		<section class="hidden" id="method-selection">
			<h2>Choose a verification method</h2>
			<button data-method="securityToken">Security Token</button>
			<button data-method="2fa">Two-factor authentication</button>
			<button data-method="bankId">Mobile BankID</button>
		</section>
	</body>
</html>
