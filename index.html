<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Admin Work Planner</title>
		<link href="css/style.css" rel="stylesheet">
		<script src="scripts/main.js" type="module" defer></script>
	</head>
	<body>
		<header>
			<section id="current-session">
				<!-- Login Button -->
				<!--
					<button>Sign In</button>
				-->
				<!-- Current Session Info -->
				<!--
					<p>Signed in as </p>
					<p>Email: ...</p>
					<p>Method: ...</p>
					<p>Session: <span id="session-time">03:54</span></p>
					<button>Sign Out</button>
				-->
			</section>
		</header>
		<h1>Tasks</h1>
		<label for="task-progress">Tasks done: <span id="done-string"></span></label>
		<progress id="task-progress"></progress>
		<button type="button" id="reset-button">Reset localStorage</button>
		<form id="new-task-form">
			<label for="new-task">New task: <input id="new-task" type="text" name="title"></label>
			<label for="new-task-priority">Priority:
				<select id="new-task-priority" name="priority">
					<option value="high">High</option>
					<option value="medium">Medium</option>
					<option value="low">Low</option>
				</select>
			</label>
			<button type="submit">Add Task</button>
			<p id="new-task-message" class="error"></p>
		</form>
		<h2>High</h2>
		<ul id="high-tasks" class="task-list">
			<!--
				<li class="task" data-id="0">
					<label for="task0">
						<input type="checkbox" id="task0"> Task description
					</label>
					<label for="task0-priority">
						<select id="task0-priority">
							<option value="high">High</option>
							...
						</select>
						priority
					</label>
					<button type="button" class="delete">Delete</button>
				</li>
			-->
		</ul>
		<h2>Medium</h2>
		<ul id="medium-tasks" class="task-list"></ul>
		<h2>Low</h2>
		<ul id="low-tasks" class="task-list"></ul>
	</body>
</html>
